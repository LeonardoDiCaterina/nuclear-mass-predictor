# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

iaea_raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/iaea_raw_data.csv

ame2016_raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/ame2016_raw_data.csv

ame2020_raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/ame2020_raw_data.csv

primary_features:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/primary_features.parquet

zeng_2022.train_dataset:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/zeng_2022/train_dataset.parquet

zeng_2022.test_dataset:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/zeng_2022/test_dataset.parquet


  
zeng_2022.X_train:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/zeng_2022/X_train.parquet

zeng_2022.X_test:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/zeng_2022/X_test.parquet

zeng_2022.y_train:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/zeng_2022/y_train.parquet

zeng_2022.y_test:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/zeng_2022/y_test.parquet

zeng_2022.scaler_params:
  type: yaml.YAMLDataset
  filepath: data/06_models/zeng_2022/scaler_params.yml

"{model_name}_{framework}_model":
  type: pickle.PickleDataset
  filepath: data/06_models/zeng_2022/{model_name}_{framework}_model.pkl

zeng_2022.unified_test_predictions:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/zeng_2022/unified_predictions.parquet

zeng_2022.evaluation_metrics:
  type: tracking.MetricsDataset
  filepath: data/08_reporting/zeng_2022/evaluation_metrics.json

liu_2024.unified_test_predictions:
  type: pandas.ParquetDataset
  filepath: data/08_reporting/liu_2024/unified_predictions.parquet

liu_2024.evaluation_metrics:
  type: tracking.JSONDataset
  filepath: data/08_reporting/liu_2024/evaluation_metrics.json

zeng_2022.residual_plots:
  type: matplotlib.MatplotlibWriter
  filepath: data/08_reporting/zeng_2022/residual_plots.png

zeng_2022.heteroscedasticity_metrics:
  type: tracking.MetricsDataset
  filepath: data/08_reporting/zeng_2022/heteroscedasticity_metrics.json

"{model_name}_{framework}_loss_history":
  type: pandas.ParquetDataset
  filepath: data/08_reporting/zeng_2022/{model_name}_{framework}_loss_history.parquet

zeng_2022.loss_convergence_plot:
  type: matplotlib.MatplotlibWriter
  filepath: data/08_reporting/zeng_2022/loss_convergence_plot.png
