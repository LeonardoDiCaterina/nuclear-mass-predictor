[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.9"
name = "nuclear_mass_predictor"
readme = "README.md"
dynamic = [ "version",]
dependencies = [
    # --- Core / Pipeline ---
    "kedro>=1.0.0",
    "kedro-datasets[api,pandas.parquet,pandas.csv]~=3.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.0.0",
    "pandera>=0.17.0",
    # --- Zeng et al. (2022): MLP for nuclear binding energy ---
    "torch>=2.0.0",
    "jax[cpu]>=0.4.0",
    "flax>=0.7.0",
    "optax>=0.1.7",
    # --- Liu et al. (2024): KAN for nuclear mass excess ---
    "jaxkan>=0.2.13",
    "tqdm>=4.66.0",
    # --- API Serving ---
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "pandas-stubs",
    "scipy-stubs",
    "types-seaborn",
]
[project.scripts]
nuclear-mass-predictor = "nuclear_mass_predictor.__main__:main"
nuclear-mass-predictor-api = "nuclear_mass_predictor.api.cli:run_api"

[tool.kedro]
package_name = "nuclear_mass_predictor"
project_name = "Nuclear Mass Predictor"
kedro_init_version = "1.5.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "nuclear_mass_predictor.__version__"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false

[tool.kedro_telemetry]
project_id = "ea161c2167d14009b9ac7d2f9c3e066f"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
